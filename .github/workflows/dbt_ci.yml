name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ecommerce_dbt/**'
      - '.github/workflows/dbt_ci.yml'

env:
  DBT_PROFILES_DIR: ./ecommerce_dbt
  DBT_TARGET: ci

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce_dbt
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja dbt-databricks
        run: |
          pip install --upgrade pip
          pip install dbt-databricks==1.8.7

      - name: Instalacja paczek dbt
        run: dbt deps

      - name: Pobranie prod-artifacts (manifest.json)
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          path: ./prod-artifacts
        continue-on-error: true

      - name: dbt build - Slim CI z fallbackiem
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_CI }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -f "./prod-artifacts/manifest.json" ]; then
            echo "Manifest z prod znaleziony - uruchamiam Slim CI (state:modified+)"
            dbt build \
              --select state:modified+ \
              --defer \
              --state ./prod-artifacts \
              --target ci
          else
            echo "Brak manifestu z prod - fallback do pelnego buildu"
            dbt build --target ci
          fi

      - name: Generowanie dokumentacji dbt
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_CI }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt docs generate --target ci

      - name: Upload dokumentacji
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-pr-${{ github.event.pull_request.number }}
          path: ecommerce_dbt/target/
          retention-days: 7
